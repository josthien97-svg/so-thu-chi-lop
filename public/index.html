<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sổ Quỹ Lớp K31</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F5F3EE;
    --surface:#FFFFFF;
    --surface-alt:#FBFAF8;
    --ink:#23292E;
    --ink-muted:#767C82;
    --border:#E2DFD6;
    --accent:#0F5C4E;
    --accent-dark:#0C4A3E;
    --accent-soft:#E4EFEC;
    --thu:#1F7A4D;
    --thu-soft:#E7F5EC;
    --chi:#B3432B;
    --chi-soft:#FBEAE5;
    --radius:14px;
    --radius-sm:9px;
    --shadow:0 1px 2px rgba(35,41,46,.05), 0 10px 28px rgba(35,41,46,.07);
    --font:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  body.dark{
    --bg:#1B1F22;
    --surface:#23282C;
    --surface-alt:#2A3034;
    --ink:#E8E6E0;
    --ink-muted:#9AA0A6;
    --border:#3A4046;
    --accent:#2FA88A;
    --accent-dark:#3FC2A0;
    --accent-soft:rgba(47,168,138,.16);
    --thu:#5BC190;
    --thu-soft:rgba(91,193,144,.14);
    --chi:#E88A67;
    --chi-soft:rgba(232,138,103,.14);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
  }
  body.dark .modal-overlay{background:rgba(0,0,0,.6);}
  body.dark .topbar{background:rgba(27,31,34,.92);}
  #bg-layer{position:fixed;inset:0;z-index:-1;background-repeat:no-repeat;background-position:center;pointer-events:none;opacity:0;transition:opacity .2s;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  #app{max-width:980px;margin:0 auto;padding:20px 16px 80px;}
  .tnum{font-variant-numeric:tabular-nums;}
  button{font-family:var(--font);cursor:pointer;}
  input,select{font-family:var(--font);}

  /* Header */
  .topbar{position:sticky;top:0;z-index:10;background:rgba(245,243,238,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);}
  .topbar-utility{max-width:980px;margin:0 auto;padding:7px 16px;display:flex;align-items:center;justify-content:flex-end;gap:6px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .topbar-inner{max-width:980px;margin:0 auto;padding:14px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;}
  .topbar-left{display:flex;align-items:center;justify-self:start;}
  .topbar-right{display:flex;align-items:center;gap:8px;justify-self:end;}
  .brand{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;}
  .brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;margin-bottom:2px;}
  .brand-text{display:flex;flex-direction:column;align-items:center;line-height:1.2;}
  .brand-text b{font-size:20px;font-weight:800;letter-spacing:.02em;color:var(--accent-dark);white-space:nowrap;}
  .brand-text span{font-size:12px;color:var(--ink-muted);font-weight:500;}
  .auth-area{display:flex;align-items:center;gap:8px;}
  .pill{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-dark);font-weight:600;}

  /* Buttons */
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;transition:.15s;white-space:nowrap;}
  .btn:hover{border-color:#c9c4b6;}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-muted);}
  .btn-ghost:hover{background:var(--surface-alt);color:var(--ink);}
  .btn-danger{color:var(--chi);}
  .btn-sm{padding:6px 10px;font-size:12.5px;}
  .icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--ink-muted);}
  .icon-btn:hover{color:var(--ink);border-color:#c9c4b6;}

  /* Layout helpers */
  .row{display:flex;align-items:center;gap:10px;}
  .between{justify-content:space-between;}
  .crumb{display:flex;align-items:center;gap:6px;color:var(--ink-muted);font-size:13px;margin-bottom:14px;}
  .crumb a{color:var(--accent-dark);text-decoration:none;font-weight:600;cursor:pointer;}
  h1.page-title{font-size:22px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em;}
  .subtitle{color:var(--ink-muted);font-size:13.5px;margin:0 0 18px;}

  /* Summary panel (ledger-stripe signature) */
  .summary{
    border-radius:var(--radius);border:1px solid var(--border);
    background:
      repeating-linear-gradient(180deg, rgba(15,92,78,.035) 0px, rgba(15,92,78,.035) 1px, transparent 1px, transparent 34px),
      var(--surface);
    padding:18px;margin-bottom:18px;box-shadow:var(--shadow);
  }
  .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;}
  .stat-label{font-size:12px;color:var(--ink-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
  .stat-value{font-size:20px;font-weight:800;letter-spacing:-.01em;}
  .stat-value.thu{color:var(--thu);}
  .stat-value.chi{color:var(--chi);}
  .stat-value.balance{color:var(--accent-dark);}
  .stat-value.muted{color:var(--ink);}

  /* Year cards / month grid */
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
  .year-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;}
  .year-card:hover{border-color:var(--accent);transform:translateY(-1px);}
  .year-card .yl{font-size:17px;font-weight:800;margin-bottom:8px;}
  .year-card .yb{font-size:13px;color:var(--ink-muted);}
  .year-card .yb b{color:var(--accent-dark);}
  .year-card.add-year-card{display:flex;align-items:center;justify-content:center;border-style:dashed;color:var(--ink-muted);min-height:64px;}
  .year-card.add-year-card .plus{font-size:32px;font-weight:300;line-height:1;}
  .year-card.add-year-card:hover{color:var(--accent);border-color:var(--accent);}
  .month-tile.add-tile{display:flex;align-items:center;justify-content:center;border-style:dashed;color:var(--ink-muted);min-height:64px;cursor:pointer;}
  .month-tile.add-tile .plus{font-size:28px;font-weight:300;line-height:1;}
  .month-tile.add-tile:hover{color:var(--accent);border-color:var(--accent);}

  .month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .month-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;cursor:pointer;transition:.15s;}
  .month-tile:hover{border-color:var(--accent);transform:translateY(-1px);}
  .month-tile .ml{font-weight:700;font-size:14.5px;margin-bottom:8px;}
  .month-tile .mrow{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-muted);margin-top:3px;}
  .month-tile .mrow b{font-weight:700;}
  .month-tile .mrow.thu b{color:var(--thu);}
  .month-tile .mrow.chi b{color:var(--chi);}

  /* Section box */
  .section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:18px;box-shadow:var(--shadow);}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .section-head h2{font-size:15.5px;margin:0;font-weight:700;}
  .empty-state{text-align:center;padding:26px 10px;color:var(--ink-muted);font-size:13.5px;}

  /* Table */
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px;}
  th{text-align:left;font-size:11.5px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.03em;font-weight:700;padding:8px 10px;border-bottom:2px solid var(--border);}
  td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  td.num{text-align:right;font-weight:600;}
  td.thu{color:var(--thu);}
  td.chi{color:var(--chi);}
  td.actions{text-align:right;white-space:nowrap;}
  td.stt{color:var(--ink-muted);}
  .note-txt{color:var(--ink-muted);font-size:12.5px;}
  .note-sub{color:var(--ink-muted);font-size:12px;margin-top:2px;}
  .qa-note-sub{display:block;margin-top:3px;font-size:12px;color:var(--ink-muted);}
  .qa-tk-label{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:11.5px;color:var(--ink-muted);cursor:pointer;user-select:none;}
  .qa-tk-label input{width:13px;height:13px;cursor:pointer;}
  td.content-thu{font-weight:700;}

  /* Quick-add row (Excel-style, revealed on hover of last row) */
  tr.add-row{opacity:0;transition:opacity .12s ease;pointer-events:none;background:var(--surface-alt);}
  tr.add-row.always{opacity:1;pointer-events:auto;}
  tr.tx-last:hover + tr.add-row{opacity:1;pointer-events:auto;}
  tr.add-row:hover, tr.add-row:focus-within{opacity:1;pointer-events:auto;}
  .qa-input{width:100%;border:1px solid transparent;background:transparent;padding:5px 6px;border-radius:6px;font-size:13.5px;font-family:var(--font);color:var(--ink);}
  .qa-input:hover{background:var(--surface);border-color:var(--border);}
  .qa-input:focus{background:var(--surface);border-color:var(--accent);outline:none;}
  input.qa-input.qa-thu{color:var(--thu);text-align:right;}
  input.qa-input.qa-chi{color:var(--chi);text-align:right;}
  tr.total-row td{background:var(--surface-alt);border-top:2px solid var(--border);font-size:13.5px;}
  .qa-save{color:var(--accent-dark);border-color:var(--accent);}
  tr.edit-row{background:var(--accent-soft);}
  td.editable-cell{cursor:pointer;border-radius:6px;}
  td.editable-cell:hover{background:var(--surface-alt);box-shadow:inset 0 0 0 1px var(--border);}

  /* Holdings list */
  .hold-item{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);}
  .hold-item:last-child{border-bottom:none;}
  .hold-name{font-weight:700;font-size:13.5px;}
  .hold-note{font-size:12px;color:var(--ink-muted);}
  .hold-amount{font-weight:700;color:var(--accent-dark);}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(35,41,46,.42);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;}
  .modal-box{background:var(--surface);border-radius:var(--radius);max-width:420px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:88vh;overflow-y:auto;}
  .modal-box h3{margin:0 0 16px;font-size:17px;font-weight:800;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  .field input[type=text],.field input[type=number],.field input[type=date],.field input[type=password]{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--surface-alt);color:var(--ink);
  }
  .field input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .seg button{flex:1;padding:9px;border:none;background:var(--surface-alt);font-weight:700;font-size:13.5px;color:var(--ink-muted);}
  .seg button.active.thu-a{background:var(--thu-soft);color:var(--thu);}
  .seg button.active.chi-a{background:var(--chi-soft);color:var(--chi);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .modal-msg{font-size:13px;color:var(--chi);margin-top:-6px;margin-bottom:12px;min-height:0;}
  .helptext{font-size:12px;color:var(--ink-muted);margin-top:6px;}

  /* Toast */
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.2);}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .footer-note{text-align:center;color:var(--ink-muted);font-size:12px;margin-top:26px;line-height:1.6;}

  .fab-login{position:fixed;bottom:22px;right:22px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;border:none;box-shadow:0 6px 20px rgba(15,92,78,.35);cursor:pointer;z-index:50;transition:.15s;}
  .fab-login:hover{background:var(--accent-dark);transform:translateY(-2px);}

  /* Print preview */
  .print-toolbar{display:flex;justify-content:space-between;max-width:820px;margin:0 auto 14px;}
  .print-sheet{background:#fff;max-width:820px;margin:0 auto 40px;padding:36px 40px;border:1px solid var(--border);box-shadow:var(--shadow);border-radius:10px;}
  .print-head{text-align:center;margin-bottom:20px;}
  .print-title{font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;}
  .print-sub{font-size:14px;color:var(--ink-muted);margin-top:2px;}
  .print-date{font-size:11.5px;color:var(--ink-muted);margin-top:6px;}
  table.print-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;}
  table.print-table th, table.print-table td{border:1px solid #ccc;padding:6px 8px;}
  table.print-table th{background:#f2f1ec;font-size:11px;text-transform:uppercase;}
  table.print-table td.num{text-align:right;}
  .print-summary{display:flex;gap:26px;justify-content:flex-end;margin-top:14px;font-size:13.5px;}
  .sig-grid{display:flex;justify-content:space-around;margin-top:56px;}
  .sig-box{text-align:center;width:220px;}
  .sig-box .role{font-weight:700;font-size:13px;}
  .sig-box .sig-space{height:60px;}
  .sig-box .line{border-top:1px solid #999;}
  .sig-box .hint{font-size:11px;color:var(--ink-muted);padding-top:4px;}

  @media (max-width:520px){
    h1.page-title{font-size:19px;}
  }

  @media print{
    .no-print{display:none !important;}
    body{background:#fff;}
    .summary{box-shadow:none;background:#fff;}
    .section{box-shadow:none;border:1px solid #ccc;}
    .print-sheet{box-shadow:none;border:none;padding:0;}
  }
</style>
</head>
<body>
<div id="bg-layer"></div>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast"></div>

<script>
/* ============ DATA MODEL ============ */
const MONTH_DEFS = [
  {key:'t8', num:8, label:'Tháng 8'}, {key:'t9', num:9, label:'Tháng 9'},
  {key:'t10',num:10,label:'Tháng 10'},{key:'t11',num:11,label:'Tháng 11'},
  {key:'t12',num:12,label:'Tháng 12'},{key:'t1', num:1, label:'Tháng 1'},
  {key:'t2', num:2, label:'Tháng 2'}, {key:'t3', num:3, label:'Tháng 3'},
  {key:'t4', num:4, label:'Tháng 4'}, {key:'t5', num:5, label:'Tháng 5'},
  {key:'t6', num:6, label:'Tháng 6'}, {key:'t7', num:7, label:'Tháng 7'}
];

let appData = null;
let isAdmin = false;
let currentView = {type:'home'};
let editingTx = null; // {yearKey, monthKey, txId}
let theme = 'light';
let adminPassword = null; // chỉ giữ trong bộ nhớ khi đang đăng nhập, không lưu vào máy
let printShowFundBreakdown = true; // Tùy chọn hiện/ẩn phần "Cơ cấu quỹ" khi xem trước & in (chỉ dùng khi đang xem, không lưu vào dữ liệu)

function genId(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function emptyMonths(){
  const o={}; MONTH_DEFS.forEach(m=> o[m.key]={transactions:[], created:false}); return o;
}
function makeYear(startYear){
  return { startYear, label:`${startYear} - ${startYear+1}`, months:emptyMonths() };
}
function defaultData(){
  // Chỉ dùng khi KHÔNG kết nối được máy chủ (dữ liệu thật nằm trên server/database).
  const y = makeYear(2026);
  return { title:'Của tôi', settings:{background:null}, years:{ '2026': y },
    holdings:[
      {id:genId(), kind:'cash', name:'Tiền mặt', opening:0, note:''},
      {id:genId(), kind:'bank', name:'Tài khoản', opening:0, note:''}
    ], editLog:[] };
}

/* ============ STORAGE (gọi API của server, không dùng window.storage nữa) ============ */
function normalizeData(){
  // Vá dữ liệu cũ để tránh lỗi và không mất dữ liệu khi nâng cấp tính năng.
  if(!Array.isArray(appData.holdings)){
    let migrated = [];
    Object.values(appData.years||{}).forEach(y=>{
      if(Array.isArray(y.holdings)){ migrated = migrated.concat(y.holdings); delete y.holdings; }
    });
    appData.holdings = migrated;
  }
  if(!appData.years) appData.years = {};
  if(!appData.settings) appData.settings = {};
  if(!appData.title) appData.title = 'Của tôi';
  // Đảm bảo luôn có đúng 1 mục "Tiền mặt" (kind:cash) và 1 mục "Tài khoản" (kind:bank), tự động cộng dồn từ giao dịch.
  let cash = appData.holdings.find(h=>h.kind==='cash');
  if(!cash){
    const guess = appData.holdings.find(h=> !h.kind && /tiền mặt|tien mat/i.test(h.name||''));
    if(guess){ guess.kind='cash'; guess.opening = Number(guess.amount)||0; delete guess.amount; if(!guess.name) guess.name='Tiền mặt'; }
    else{ appData.holdings.unshift({id:genId(), kind:'cash', name:'Tiền mặt', opening:0, note:''}); }
  }
  let bank = appData.holdings.find(h=>h.kind==='bank');
  if(!bank){
    const guess = appData.holdings.find(h=> !h.kind && h.kind!=='cash' && /tài khoản|ngân hàng|tai khoan/i.test(h.name||''));
    if(guess){ guess.kind='bank'; guess.opening = Number(guess.amount)||0; delete guess.amount; }
    else{ appData.holdings.splice(1,0,{id:genId(), kind:'bank', name:'Tài khoản', opening:0, note:''}); }
  }
  appData.holdings.forEach(h=>{ if(!h.kind) h.kind='other'; });
  if(!Array.isArray(appData.editLog)) appData.editLog = [];
  // Vá dữ liệu cũ (trước khi có tính năng "tự tạo từng tháng"): tháng nào chưa có cờ created,
  // nếu đã có giao dịch hoặc đã khóa thì coi là đã tạo; ngược lại (tháng trống, chưa dùng) coi là chưa tạo.
  Object.values(appData.years).forEach(y=>{
    MONTH_DEFS.forEach(m=>{
      const mo = y.months[m.key];
      if(!mo){ y.months[m.key] = {transactions:[], created:false}; return; }
      if(typeof mo.created !== 'boolean'){
        mo.created = (mo.transactions && mo.transactions.length>0) || !!mo.locked;
      }
    });
  });
}
async function loadData(){
  try{
    const res = await fetch('/api/data');
    if(!res.ok) throw new Error('fetch_failed');
    appData = await res.json();
    normalizeData();
  }catch(e){
    appData = defaultData();
    showToast('Không kết nối được máy chủ — đang hiển thị dữ liệu tạm thời.');
  }
}
async function persist(){
  try{
    const res = await fetch('/api/data', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: adminPassword, data: appData })
    });
    if(!res.ok){
      if(res.status===401){ showToast('Phiên đăng nhập đã hết — vui lòng đăng nhập lại rồi thử lưu lại.'); isAdmin=false; adminPassword=null; computeAndApplyTheme(); render(); }
      else{ showToast('Không lưu được dữ liệu lên máy chủ.'); }
    }
  }catch(e){
    showToast('Không lưu được — kiểm tra kết nối mạng rồi thử lại.');
  }
}
function commit(){ render(); persist(); }

const systemDarkMQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function loadTheme(){
  try{ theme = localStorage.getItem('theme-pref')==='dark' ? 'dark' : 'light'; }
  catch(e){ theme = 'light'; }
}
function computeAndApplyTheme(){

/* ============ BACKGROUND (chỉ Admin tùy chỉnh, mọi người đều thấy) ============ */
function applyBackgroundRaw(bg){
  const el = document.getElementById('bg-layer');
  if(!el) return;
  if(!bg || !bg.dataUrl){ el.style.opacity = 0; el.style.backgroundImage=''; return; }
  el.style.backgroundImage = `url("${bg.dataUrl}")`;
  el.style.backgroundSize = bg.mode==='contain' ? 'contain' : (bg.mode==='repeat' ? 'auto' : 'cover');
  el.style.backgroundRepeat = bg.mode==='repeat' ? 'repeat' : 'no-repeat';
  el.style.filter = `brightness(${bg.brightness||100}%)`;
  el.style.opacity = (bg.opacity!=null ? bg.opacity : 60) / 100;
}
function applyBackground(){ applyBackgroundRaw(appData.settings.background); }
function readBgFormLive(){
  return {
    opacity: parseInt(document.getElementById('bg-opacity').value,10),
    brightness: parseInt(document.getElementById('bg-brightness').value,10),
    mode: document.getElementById('bg-mode').value
  };
}
function previewBackgroundLive(){
  const cur = appData.settings.background;
  applyBackgroundRaw({ dataUrl: cur ? cur.dataUrl : null, ...readBgFormLive() });
}
function commitBackgroundSettings(){
  if(!appData.settings.background) return;
  Object.assign(appData.settings.background, readBgFormLive());
  persist();
}
function handleBackgroundFile(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('Vui lòng chọn một file ảnh.'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxW = 1600;
      let w = img.width, h = img.height;
      if(w>maxW){ h = Math.round(h*(maxW/w)); w = maxW; }
      const canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
      const existing = appData.settings.background || {opacity:60, brightness:100, mode:'cover'};
      appData.settings.background = {...existing, dataUrl};
      applyBackground();
      persist();
      showToast('Đã cập nhật ảnh nền.');
      mSettings();
    };
    img.onerror = ()=> showToast('Không đọc được ảnh này.');
    img.src = e.target.result;
  };
  reader.onerror = ()=> showToast('Không đọc được file.');
  reader.readAsDataURL(file);
  inputEl.value='';
}
function removeBackground(){
  appData.settings.background = null;
  applyBackground();
  persist();
  showToast('Đã xóa ảnh nền.');
  mSettings();
}

/* ============ HELPERS ============ */
function money(n){ return (Math.round(Number(n)||0)).toLocaleString('vi-VN') + ' đ'; }
function dispDate(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}`; }
function todayISO(){ const d=new Date(); const off=d.getTimezoneOffset(); return new Date(d.getTime()-off*60000).toISOString().slice(0,10); }
function todayFull(){ const [y,m,d]=todayISO().split('-'); return `${d}/${m}/${y}`; }
function nowStamp(){ const d=new Date(); const dd=String(d.getDate()).padStart(2,'0'); const mm=String(d.getMonth()+1).padStart(2,'0'); const yy=d.getFullYear(); const hh=String(d.getHours()).padStart(2,'0'); const mi=String(d.getMinutes()).padStart(2,'0'); return `${dd}/${mm}/${yy} ${hh}:${mi}`; }
function logEdit(yearKey, monthKey, message){
  if(!Array.isArray(appData.editLog)) appData.editLog=[];
  const monthDef = MONTH_DEFS.find(m=>m.key===monthKey);
  const year = appData.years[yearKey];
  appData.editLog.unshift({id:genId(), ts:nowStamp(), yearKey, monthKey, monthLabel: monthDef?monthDef.label:'', yearLabel: year?year.label:'', message});
  if(appData.editLog.length>300) appData.editLog.length=300;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function monthYearNum(startYear, monthKey){ const m=MONTH_DEFS.find(x=>x.key===monthKey); return m.num>=8? startYear : startYear+1; }
function sortedYearKeys(){ return Object.keys(appData.years).sort((a,b)=> a-b); }
function monthTotals(year, monthKey){
  const mo = year.months[monthKey];
  const txs = mo ? mo.transactions : [];
  let thu=0, chi=0;
  txs.forEach(t=> t.type==='thu' ? thu+=Number(t.amount)||0 : chi+=Number(t.amount)||0);
  return {thu, chi, conLai: thu-chi};
}
function yearTotals(year){
  let thu=0, chi=0;
  MONTH_DEFS.forEach(m=>{ const t=monthTotals(year, m.key); thu+=t.thu; chi+=t.chi; });
  return {thu, chi, conLai: thu-chi};
}
// Quỹ đầu năm = quỹ cuối năm học trước đó (đệ quy ngược về trước), hoặc 0 nếu không có năm trước.
function yearOpening(yearKey){
  const y = appData.years[yearKey];
  if(!y) return 0;
  const prevKey = String(y.startYear - 1);
  const prevYear = appData.years[prevKey];
  if(!prevYear) return 0;
  return yearOpening(prevKey) + yearTotals(prevYear).conLai;
}
function yearClosing(yearKey){
  const y = appData.years[yearKey];
  if(!y) return 0;
  return yearOpening(yearKey) + yearTotals(y).conLai;
}
// Quỹ đầu tháng = quỹ đầu năm + cộng dồn Thu-Chi của các tháng TRƯỚC tháng này trong cùng năm.
function monthOpening(yearKey, monthKey){
  const year = appData.years[yearKey];
  let sum = yearOpening(yearKey);
  for(const m of MONTH_DEFS){
    if(m.key===monthKey) break;
    const t = monthTotals(year, m.key);
    sum += t.thu - t.chi;
  }
  return sum;
}
function monthClosing(yearKey, monthKey){
  const year = appData.years[yearKey];
  const t = monthTotals(year, monthKey);
  return monthOpening(yearKey, monthKey) + t.thu - t.chi;
}
function allTimeTotals(){
  let thu=0, chi=0;
  Object.values(appData.years).forEach(year=>{ const t=yearTotals(year); thu+=t.thu; chi+=t.chi; });
  return {thu, chi, conLai: thu-chi};
}
// Tổng cộng dồn (Thu - Chi) của tất cả giao dịch được gắn vào một nơi giữ tiền cụ thể ('tienmat' hoặc 'taikhoan')
function locationNet(locationKey){
  let net = 0;
  Object.values(appData.years).forEach(year=>{
    MONTH_DEFS.forEach(m=>{
      year.months[m.key].transactions.forEach(tx=>{
        const loc = tx.location || 'tienmat';
        if(loc !== locationKey) return;
        net += tx.type==='thu' ? (Number(tx.amount)||0) : -(Number(tx.amount)||0);
      });
    });
  });
  return net;
}
function holdingAmount(h){
  if(h.kind==='cash') return (Number(h.opening)||0) + locationNet('tienmat');
  if(h.kind==='bank') return (Number(h.opening)||0) + locationNet('taikhoan');
  return Number(h.amount)||0;
}
function holdingsTotal(){ return appData.holdings.reduce((s,h)=> s+holdingAmount(h), 0); }
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=> el.classList.remove('show'), 2600);
}

          return `

            <td class="${canEdit?'editable-cell':''}" ${canEdit?`data-action="start-edit-tx" data-year="${yearKey}" data-month="${monthKey}" data-id="${tx.id}"`:''}>${dispDate(tx.date)}</td>

            <td class="num chi tnum ${canEdit?'editable-cell':''}" ${canEdit?`data-action="start-edit-tx" data-year="${yearKey}" data-month="${monthKey}" data-id="${tx.id}"`:''}>${tx.type==='chi'? money(tx.amount):''}</td>
            ${canEdit ? `<td class="actions no-print"></td>` : ''}

/* ============ PRINT PREVIEW ============ */
function renderPrintPreview(){
  const {scope, yearKey, monthKey} = currentView;
  const year = appData.years[yearKey];
  if(!year) return renderHome();
  let titleLine2 = '';
  let bodyHtml = '';
  if(scope==='month'){
    const monthDef = MONTH_DEFS.find(m=>m.key===monthKey);
    const txs = [...year.months[monthKey].transactions].sort((a,b)=> (a.date||'').localeCompare(b.date||''));
    const t = monthTotals(year, monthKey);
    const opening = monthOpening(yearKey, monthKey);
    const closing = opening + t.thu - t.chi;
    titleLine2 = `${monthDef.label} — Năm học ${esc(year.label)}`;
    bodyHtml = `
      <table class="print-table">
        <thead><tr><th>STT</th><th>Ngày</th><th>Nội dung</th><th>Thu</th><th>Chi</th></tr></thead>

          <tr style="font-weight:700;background:#f2f1ec;">

    titleLine2 = `Báo cáo bàn giao quỹ — Năm học ${esc(year.label)}`;
    const fundItems = appData.holdings;

    bodyHtml = `
      <p style="font-size:13px;margin:0 0 10px;">Quỹ đầu năm: <b>${money(opening)}</b></p>
      <table class="print-table">
        <thead><tr><th>Tháng</th><th>Thu</th><th>Chi</th><th>Còn lại tháng</th></tr></thead>
        <tbody>
          ${createdMonths.length? createdMonths.map(m=>{ const mt=monthTotals(year,m.key); return `<tr><td>${m.label}</td><td class="num">${money(mt.thu)}</td><td class="num">${money(mt.chi)}</td><td class="num">${money(mt.conLai)}</td></tr>`; }).join('') : `<tr><td colspan="4" style="text-align:center;color:#888;">Chưa có tháng nào được tạo</td></tr>`}
          <tr style="font-weight:700;"><td>Tổng cộng</td><td class="num">${money(t.thu)}</td><td class="num">${money(t.chi)}</td><td class="num">${money(t.conLai)}</td></tr>
        </tbody>

      <p style="font-size:13px;margin:10px 0 0;text-align:right;">Quỹ hiện còn (đầu năm + cả năm): <b>${money(closing)}</b></p>
      ${printShowFundBreakdown ? `

      <table class="print-table">
        <thead><tr><th>Khoản</th><th>Số tiền</th><th>Ghi chú</th></tr></thead>

  return `

function exportBackup(){
  if(typeof XLSX==='undefined'){ showToast('Chưa tải được thư viện Excel, vui lòng thử lại.'); return; }
  try{
    const wb = XLSX.utils.book_new();

    const txRows = [['NamBatDau','NamHoc','ThangKey','Thang','Ngay','NoiDung','GhiChu','Loai','SoTien','NoiGiu']];
    Object.keys(appData.years).forEach(yk=>{
      const year = appData.years[yk];
      MONTH_DEFS.forEach(m=>{
        year.months[m.key].transactions.forEach(tx=>{
          txRows.push([year.startYear, year.label, m.key, m.label, tx.date, tx.content, tx.note||'', tx.type, tx.amount, tx.location||'tienmat']);
        });
      });
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(txRows), 'GiaoDich');

    const holdRows = [['Loai','Ten','SoTien','GhiChu']];
    appData.holdings.forEach(h=>{
      const val = (h.kind==='cash'||h.kind==='bank') ? (h.opening||0) : (h.amount||0);
      holdRows.push([h.kind, h.name, val, h.note||'']);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(holdRows), 'Quy');

    const lockRows = [['NamBatDau','ThangKey','Khoa']];
    Object.keys(appData.years).forEach(yk=>{
      const year = appData.years[yk];
      MONTH_DEFS.forEach(m=>{ if(year.months[m.key].locked) lockRows.push([year.startYear, m.key, 'TRUE']); });
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(lockRows), 'ThangKhoa');

    const settingRows = [['Ten'], [appData.title]]; // Mật khẩu không nằm trong file sao lưu vì lý do an toàn — đổi mật khẩu qua mục Cài đặt.
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(settingRows), 'CaiDat');

    XLSX.writeFile(wb, `SoThuChi_SaoLuu_${todayISO()}.xlsx`);
    showToast('Đã tải file sao lưu Excel.');
  }catch(e){
    showToast('Không tải được file sao lưu.');
  }
}
function handleImportFile(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  if(typeof XLSX==='undefined'){ showToast('Chưa tải được thư viện Excel, vui lòng thử lại.'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    let wb;
    try{ wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true}); }
    catch(err){ showToast('Không đọc được file — file có thể bị hỏng.'); return; }
    const txSheet = wb.Sheets['GiaoDich'];
    if(!txSheet){ showToast('File Excel không đúng định dạng sao lưu (thiếu sheet GiaoDich).'); return; }
    const txRows = XLSX.utils.sheet_to_json(txSheet, {header:1}).slice(1);
    const newYears = {};
    txRows.forEach(r=>{
      if(!r || r[0]==null || r[0]==='') return;
      const [startYear,,monthKey,,dateVal,content,note,type,amount,location] = r;
      const yk = String(Math.round(Number(startYear)));
      if(!newYears[yk]) newYears[yk] = makeYear(Number(startYear));
      if(!newYears[yk].months[monthKey]) return;
      let dateStr = dateVal;
      if(dateVal instanceof Date){ const off=dateVal.getTimezoneOffset(); dateStr = new Date(dateVal.getTime()-off*60000).toISOString().slice(0,10); }
      else if(typeof dateVal==='number'){ const d=XLSX.SSF.parse_date_code(dateVal); dateStr=`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; }
      newYears[yk].months[monthKey].transactions.push({
        id:genId(), date:String(dateStr||''), content:content||'', note:note||'',
        type: type==='thu'?'thu':'chi', amount:Number(amount)||0, location: location==='taikhoan'?'taikhoan':'tienmat'
      });
    });
    if(Object.keys(newYears).length===0){ showToast('Không tìm thấy dữ liệu năm học nào trong file.'); return; }

    const newHoldings = [];
    const holdSheet = wb.Sheets['Quy'];
    if(holdSheet){
      XLSX.utils.sheet_to_json(holdSheet, {header:1}).slice(1).forEach(r=>{
        if(!r || !r[1]) return;
        const [kind,name,amount,note] = r;
        if(kind==='cash'||kind==='bank'){ newHoldings.push({id:genId(), kind, name:name||(kind==='cash'?'Tiền mặt':'Tài khoản'), opening:Number(amount)||0, note:note||''}); }
        else{ newHoldings.push({id:genId(), kind:'other', name:name||'', amount:Number(amount)||0, note:note||''}); }
      });
    }
    const lockSheet = wb.Sheets['ThangKhoa'];
    if(lockSheet){
      XLSX.utils.sheet_to_json(lockSheet, {header:1}).slice(1).forEach(r=>{
        if(!r || r[0]==null) return;
        const [startYear, monthKey, khoa] = r;
        const yk = String(Math.round(Number(startYear)));
        if(newYears[yk] && newYears[yk].months[monthKey] && String(khoa).toUpperCase()==='TRUE'){ newYears[yk].months[monthKey].locked = true; }
      });
    }
    let title = appData.title;
    const setSheet = wb.Sheets['CaiDat'];
    if(setSheet){
      const rows = XLSX.utils.sheet_to_json(setSheet, {header:1});
      if(rows[1]){ title = rows[1][0] || title; }
    }

    mConfirm('Khôi phục sẽ THAY THẾ toàn bộ dữ liệu hiện tại bằng dữ liệu trong file Excel này (không gồm mật khẩu). Bạn chắc chắn chứ?', ()=>{
      appData = { title, settings:{background: appData.settings.background||null}, years:newYears, holdings:newHoldings, editLog:[] };
      normalizeData();
      editingTx = null;
      currentView = {type:'home'};
      closeModal();
      commit();
      showToast('Đã khôi phục dữ liệu từ file Excel.');
    });
  };
  reader.readAsArrayBuffer(file);
  inputEl.value = '';
}

function monthSheetRows(year, monthKey){
  const txs = [...year.months[monthKey].transactions].sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  const rows = [['STT','Ngày','Nội dung','Ghi chú','Thu','Chi']];
  txs.forEach((tx,i)=> rows.push([i+1, dispDate(tx.date), tx.content, tx.note||'', tx.type==='thu'?tx.amount:'', tx.type==='chi'?tx.amount:'']));
  const mt = monthTotals(year, monthKey);
  rows.push(['','','Tổng cộng','', mt.thu, mt.chi]);
  return rows;
}
function exportMonthExcel(yearKey, monthKey){
  if(typeof XLSX==='undefined'){ showToast('Chưa tải được thư viện Excel, vui lòng thử lại.'); return; }
  const year = appData.years[yearKey];
  const monthDef = MONTH_DEFS.find(m=>m.key===monthKey);
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(monthSheetRows(year, monthKey));
  XLSX.utils.book_append_sheet(wb, ws, monthDef.label);
  XLSX.writeFile(wb, `ThuChi_${monthDef.label.replace(' ','')}_${year.label.replace(/\s/g,'')}.xlsx`);
}
function exportYearExcel(yearKey){
  if(typeof XLSX==='undefined'){ showToast('Chưa tải được thư viện Excel, vui lòng thử lại.'); return; }
  const year = appData.years[yearKey];
  const wb = XLSX.utils.book_new();
  const t = yearTotals(year);
  const createdMonths = MONTH_DEFS.filter(m => year.months[m.key] && year.months[m.key].created);
  const summaryRows = [['Tháng','Thu','Chi','Còn lại']];
  createdMonths.forEach(m=>{ const mt=monthTotals(year, m.key); summaryRows.push([m.label, mt.thu, mt.chi, mt.conLai]); });
  summaryRows.push(['Tổng cộng', t.thu, t.chi, t.conLai]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), 'Tong ket');
  createdMonths.forEach(m=>{
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(monthSheetRows(year, m.key)), m.label.replace('Tháng','Th'));
  });
  XLSX.writeFile(wb, `ThuChi_NamHoc_${year.label.replace(/\s/g,'')}.xlsx`);
}

function submitTx(yearKey, monthKey, txId){
  const type = document.getElementById('tx-type').value;
  const date = document.getElementById('tx-date').value;
  const content = document.getElementById('tx-content').value.trim();
  const rawInput = parseFloat(document.getElementById('tx-amount').value);
  const amount = (rawInput||0) * 1000;
  const note = document.getElementById('tx-note').value.trim();
  if(!content){ document.getElementById('tx-err').textContent='Vui lòng nhập nội dung.'; return; }
  if(!date){ document.getElementById('tx-err').textContent='Vui lòng chọn ngày.'; return; }
  if(!amount || amount<=0){ document.getElementById('tx-err').textContent='Số tiền phải lớn hơn 0.'; return; }
  const year = appData.years[yearKey];
  const list = year.months[monthKey].transactions;
  if(txId){
    const tx = list.find(t=>t.id===txId);
    Object.assign(tx, {type,date,content,amount,note});
  } else {
    list.push({id:genId(), type, date, content, amount, note});
  }
  closeModal(); commit(); showToast('Đã lưu giao dịch.');
}
function isMonthLocked(yearKey, monthKey){
  const y = appData.years[yearKey];
  return !!(y && y.months[monthKey] && y.months[monthKey].locked);
}
function toggleMonthLock(yearKey, monthKey){
  const m = appData.years[yearKey].months[monthKey];
  m.locked = !m.locked;
  if(m.locked){
    appData.editLog = (appData.editLog||[]).filter(e=> !(e.yearKey===yearKey && e.monthKey===monthKey));
    showToast('Đã khóa tháng — lịch sử chỉnh sửa của tháng này cũng đã được dọn.');
  } else {
    showToast('Đã mở khóa tháng.');
  }
  editingTx = null;
  commit();
}

function deleteTx(yearKey, monthKey, txId){
  if(isMonthLocked(yearKey, monthKey)){ showToast('Tháng này đã bị khóa.'); return; }
  const year = appData.years[yearKey];
  const tx = year.months[monthKey].transactions.find(t=>t.id===txId);
  mConfirm('Xóa giao dịch này? Hành động này không thể hoàn tác.', ()=>{
    year.months[monthKey].transactions = year.months[monthKey].transactions.filter(t=>t.id!==txId);
    if(editingTx && editingTx.txId===txId) editingTx=null;
    if(tx) logEdit(yearKey, monthKey, `Xóa giao dịch: ${tx.content} (${tx.type==='thu'?'+':'-'}${money(tx.amount)})`);
    closeModal(); commit(); showToast('Đã xóa giao dịch.');
  });
}

// để không làm gián đoạn/hụt mất cú nhấp chuột đang bay tới đích khác (ví dụ mở dòng sửa khác).
function autoSaveEditRowSilent(row){
  if(!editingTx) return;
  const {yearKey, monthKey, txId} = editingTx;
  if(isMonthLocked(yearKey, monthKey)){ editingTx=null; return; }
  const date = row.querySelector('.qa-date').value;
  const content = row.querySelector('.qa-content').value.trim();
  const thuRaw = parseFloat(row.querySelector('.qa-thu').value);
  const chiRaw = parseFloat(row.querySelector('.qa-chi').value);
  const note = row.querySelector('.qa-note').value.trim();
  const tkEl = row.querySelector('.qa-tk');
  const location = (tkEl && tkEl.checked) ? 'taikhoan' : 'tienmat';
  editingTx = null;
  if(!date || !content || !(thuRaw>0 || chiRaw>0)){
    return; // thiếu dữ liệu hợp lệ -> không lưu, chỉ thoát khỏi chế độ sửa
  }
  const type = thuRaw>0 ? 'thu' : 'chi';
  const amount = (thuRaw>0 ? thuRaw : chiRaw) * 1000;
  const year = appData.years[yearKey];
  const tx = year && year.months[monthKey].transactions.find(t=>t.id===txId);
  if(tx){ Object.assign(tx, {date, content, type, amount, location, note}); logEdit(yearKey, monthKey, `Sửa giao dịch: ${content} (${type==='thu'?'+':'-'}${money(amount)})`); persist(); }
}

function qaSaveFromRow(row, yearKey, monthKey){
  if(isMonthLocked(yearKey, monthKey)){ showToast('Tháng này đã bị khóa.'); return; }
  const date = row.querySelector('.qa-date').value;
  const content = row.querySelector('.qa-content').value.trim();
  const thuRaw = parseFloat(row.querySelector('.qa-thu').value);
  const chiRaw = parseFloat(row.querySelector('.qa-chi').value);
  const note = row.querySelector('.qa-note').value.trim();
  const location = row.querySelector('.qa-tk').checked ? 'taikhoan' : 'tienmat';
  if(!date){ showToast('Vui lòng chọn ngày.'); row.querySelector('.qa-date').focus(); return; }
  if(!content){ showToast('Vui lòng nhập nội dung.'); row.querySelector('.qa-content').focus(); return; }
  let type, amount;
  if(thuRaw>0){ type='thu'; amount=thuRaw*1000; }
  else if(chiRaw>0){ type='chi'; amount=chiRaw*1000; }
  else { showToast('Vui lòng nhập số tiền vào cột Thu hoặc Chi.'); row.querySelector('.qa-thu').focus(); return; }
  const year = appData.years[yearKey];
  year.months[monthKey].transactions.push({id:genId(), date, content, type, amount, location, note});
  logEdit(yearKey, monthKey, `Thêm giao dịch: ${content} (${type==='thu'?'+':'-'}${money(amount)})`);
  pendingFocusQuickAdd = true;
  commit();
  showToast('Đã thêm giao dịch.');
}

  if(!content){ showToast('Vui lòng nhập nội dung.'); return; }
  let type, amount;
  if(thuRaw>0){ type='thu'; amount=thuRaw*1000; }

  else { showToast('Vui lòng nhập số tiền vào cột Thu hoặc Chi.'); return; }

function submitHolding(holdId){
  const name = document.getElementById('h-name').value.trim();
  const amount = parseFloat(document.getElementById('h-amount').value);
  const note = document.getElementById('h-note').value.trim();
  if(!name){ document.getElementById('h-err').textContent='Vui lòng nhập tên khoản.'; return; }
  if(isNaN(amount) || amount<0){ document.getElementById('h-err').textContent='Số tiền không hợp lệ.'; return; }
  if(holdId){
    const h = appData.holdings.find(x=>x.id===holdId);
    if(h.kind==='cash' || h.kind==='bank'){
      // Người dùng sửa số dư HIỆN TẠI trực tiếp -> quy đổi ngược lại thành số dư ban đầu (opening) để giao dịch tiếp tục cộng/trừ đúng từ mốc mới.
      const locKey = h.kind==='cash' ? 'tienmat' : 'taikhoan';
      h.opening = amount - locationNet(locKey);
      h.name = name; h.note = note;
    } else {
      Object.assign(h, {name, amount, note});
    }
  } else {
    appData.holdings.push({id:genId(), kind:'other', name, amount, note});
  }
  closeModal(); commit(); showToast('Đã lưu.');
}
function deleteHolding(holdId){
  const h = appData.holdings.find(x=>x.id===holdId);
  if(h && (h.kind==='cash'||h.kind==='bank')){ showToast('Không thể xóa mục Tiền mặt / Tài khoản.'); return; }
  mConfirm('Xóa khoản này?', ()=>{
    appData.holdings = appData.holdings.filter(x=>x.id!==holdId);
    closeModal(); commit(); showToast('Đã xóa.');
  });
}

/* ============ EVENT DELEGATION ============ */
function bindGlobalActions(){
  document.getElementById('app').onclick = (e)=>{
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const a = el.dataset.action;
    if(a==='go-home'){ currentView={type:'home'}; editingTx=null; render(); }
    else if(a==='toggle-theme'){ toggleTheme(); }
    else if(a==='go-back'){ editingTx=null; goBack(); }
    else if(a==='open-year'){ currentView={type:'year', yearKey:el.dataset.year}; editingTx=null; render(); }
    else if(a==='open-month'){ currentView={type:'month', yearKey:el.dataset.year, monthKey:el.dataset.month}; editingTx=null; render(); }
    else if(a==='open-login'){ mLogin(); }
    else if(a==='logout'){ isAdmin=false; adminPassword=null; computeAndApplyTheme(); render(); showToast('Đã chuyển sang chế độ xem.'); }
    else if(a==='open-settings'){ mSettings(); }
    else if(a==='open-new-year'){ mNewYear(); }
    else if(a==='open-new-month'){ mNewMonth(el.dataset.year); }
    else if(a==='edit-tx'){ mTx(el.dataset.year, el.dataset.month, el.dataset.id); }
    else if(a==='start-edit-tx'){ if(isMonthLocked(el.dataset.year, el.dataset.month)){ showToast('Tháng này đã bị khóa.'); } else { editingTx={yearKey:el.dataset.year, monthKey:el.dataset.month, txId:el.dataset.id}; render(); } }
    else if(a==='save-edit-tx'){ saveEditTx(el.dataset.year, el.dataset.month, el.dataset.id, el.closest('tr.edit-row')); }
    else if(a==='cancel-edit-tx'){ cancelEditTx(); }
    else if(a==='delete-tx'){ deleteTx(el.dataset.year, el.dataset.month, el.dataset.id); }
    else if(a==='open-new-holding'){ mHolding(null); }
    else if(a==='edit-holding'){ mHolding(el.dataset.id); }
    else if(a==='delete-holding'){ deleteHolding(el.dataset.id); }
    else if(a==='open-funds'){ currentView={type:'funds'}; render(); }
    else if(a==='open-editlog'){ currentView={type:'editlog'}; render(); }
    else if(a==='toggle-lock'){ toggleMonthLock(el.dataset.year, el.dataset.month); }
    else if(a==='open-print-preview'){ currentView={type:'print-preview', scope:el.dataset.scope, yearKey:el.dataset.year, monthKey:el.dataset.month}; editingTx=null; render(); }
    else if(a==='export-excel-year'){ exportYearExcel(el.dataset.year); }
    else if(a==='export-excel-month'){ exportMonthExcel(el.dataset.year, el.dataset.month); }
    else if(a==='close-print-preview'){ exitPrintPreview(); }
    else if(a==='do-print'){ window.print(); }
    else if(a==='qa-save'){ qaSaveFromRow(el.closest('tr.add-row'), el.dataset.year, el.dataset.month); }
    else if(a==='print'){ window.print(); }
  };
  document.getElementById('app').oninput = (e)=>{
    if(e.target.classList.contains('qa-thu') && e.target.value){
      const row=e.target.closest('tr'); const chi=row.querySelector('.qa-chi'); if(chi) chi.value='';
    }
    if(e.target.classList.contains('qa-chi') && e.target.value){
      const row=e.target.closest('tr'); const thu=row.querySelector('.qa-thu'); if(thu) thu.value='';
    }
  };
  document.getElementById('app').onfocusout = (e)=>{
    if(!e.target.classList || !(e.target.classList.contains('qa-input') || e.target.classList.contains('qa-tk'))) return;
    const row = e.target.closest('tr.edit-row');
    if(!row) return; // chỉ tự động lưu cho dòng đang sửa, không áp dụng cho dòng thêm mới
    const next = e.relatedTarget;
    if(next && row.contains(next)) return; // vẫn còn trong cùng dòng (đang Tab qua ô khác) — chưa cần lưu
    autoSaveEditRowSilent(row);
    // Vẽ lại trang ở tick kế tiếp — nếu cú nhấp chuột đã tự vẽ lại trang rồi thì lệnh này chỉ vô hại, dư thừa.
    setTimeout(render, 0);
  };
  document.getElementById('app').onkeydown = (e)=>{
    if(e.key==='Enter' && e.target.classList.contains('qa-input')){
      e.preventDefault();
      const addRow = e.target.closest('tr.add-row');
      const editRow = e.target.closest('tr.edit-row');
      if(addRow){ const btn = addRow.querySelector('.qa-save'); qaSaveFromRow(addRow, btn.dataset.year, btn.dataset.month); }
      else if(editRow){ const btn = editRow.querySelector('[data-action="save-edit-tx"]'); saveEditTx(btn.dataset.year, btn.dataset.month, btn.dataset.id, editRow); }
    }
    if(e.key==='Escape' && e.target.classList.contains('qa-input')){
      const editRow = e.target.closest('tr.edit-row');
      if(editRow){ cancelEditTx(); }
    }
  };
  document.getElementById('modal-root').onclick = (e)=>{
    const el = e.target.closest('[data-action]');
    const overlay = e.target.closest('[data-action="modal-overlay"]');
    if(e.target.dataset && e.target.dataset.action==='modal-overlay'){ closeModal(); return; }
    if(!el) return;
    const a = el.dataset.action;
    if(a==='close-modal'){ closeModal(); }
    else if(a==='submit-login'){ submitLogin(); }
    else if(a==='submit-settings'){ submitSettings(); }
    else if(a==='submit-new-year'){ submitNewYear(); }
    else if(a==='submit-new-month'){ submitNewMonth(el.dataset.year); }
    else if(a==='submit-tx'){ submitTx(el.dataset.year, el.dataset.month, el.dataset.id||null); }
    else if(a==='submit-holding'){ submitHolding(el.dataset.id||null); }
    else if(a==='export-backup'){ exportBackup(); }
    else if(a==='trigger-import'){ document.getElementById('import-file-input').click(); }
    else if(a==='trigger-bg-upload'){ document.getElementById('bg-file-input').click(); }
    else if(a==='remove-background'){ removeBackground(); }
    else if(a==='set-tx-type'){
      document.getElementById('tx-type').value = el.dataset.type;
      el.parentElement.querySelectorAll('button').forEach(b=> b.classList.remove('active','thu-a','chi-a'));
      el.classList.add('active', el.dataset.type==='thu'?'thu-a':'chi-a');
    }
  };
  // Enter key submits login
  document.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){
      const loginInput = document.getElementById('in-pass');
      if(loginInput && document.activeElement===loginInput){ submitLogin(); }
    }
  });
}

/* ============ INIT ============ */
(async function init(){
  loadTheme();
  await loadData();
  computeAndApplyTheme();
  applyBackground();
  if(systemDarkMQ){
    systemDarkMQ.addEventListener ? systemDarkMQ.addEventListener('change', computeAndApplyTheme) : systemDarkMQ.addListener(computeAndApplyTheme);
  }
  render();
})();
</script>
